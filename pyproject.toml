[project]
name = "prometheus"
version = "0.1.0"
description = "AI Library"
readme = "README.md"
authors = [
    { name = "deepmatics", email = "satish@deepmatics-ai.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dataclasses>=0.8",
    "datasets>=5.1.0",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "ninja>=1.13.2",
    "numpy>=2.5.4",
    "packaging>=26.3",
    "pandas>=3.0.6",
    "pip>=26.2.1",
    "seaborn>=0.13.2",
    "setuptools>=84.0.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "wandb>=0.31.0",
    "wheel>=0.48.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
typeCheckingMode = "basic"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
torchvision = [{ index = "pytorch-cu132" }]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv]
preview = true