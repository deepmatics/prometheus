[project]
name = "prometheus"
version = "0.1.0"
description = "Learning Library"
readme = "README.md"
authors = [
    { name = "deepmatics", email = "satish@deepmatics-ai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
prometheus = "prometheus:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]
